<!doctype html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>نواروم — آدرس تغییر کرد</title>
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#1b1d21" />
    <link rel="icon" href="/logo/logo-icon.svg" type="image/svg+xml" />
    <style>
        @font-face {
            font-family: 'Vazir';
            src: url('/fonts/Vazir-Regular.woff2') format('woff2');
            font-weight: 500;
            font-display: swap;
        }

        @font-face {
            font-family: 'Vazir';
            src: url('/fonts/Vazir-Bold.woff2') format('woff2');
            font-weight: 700;
            font-display: swap;
        }

        @font-face {
            font-family: 'Nunito';
            src: url('/fonts/Nunito-Latin.woff2') format('woff2');
            font-weight: 200 1000;
            font-display: swap;
        }

        :root {
            --bg: #1b1d21;
            --surface: #22252b;
            --border: #313741;
            --text: #f9fafb;
            --muted: #9ca3af;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
        }

        @media (prefers-color-scheme: light) {
            :root {
                --bg: #ffffff;
                --surface: #f9fafb;
                --border: #e5e7eb;
                --text: #111827;
                --muted: #6b7280;
            }
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: var(--bg);
            color: var(--text);
            font-family: 'Vazir', 'Nunito', system-ui, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        main {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            animation: rise 0.4s cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        @keyframes rise {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            width: 64px;
            height: 64px;
            object-fit: contain;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 22px;
            font-weight: 700;
            line-height: 1.6;
            margin-bottom: 10px;
        }

        .lead {
            font-size: 14.5px;
            line-height: 2;
            color: var(--muted);
            margin-bottom: 28px;
        }

        .route {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            direction: ltr;
            font-family: 'Nunito', sans-serif;
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 28px;
        }

        .route span {
            width: 100%;
            padding: 14px 10px;
            border-radius: 9999px;
            background: var(--surface);
            border: 1px solid var(--border);
        }

        .route .old {
            color: var(--muted);
            text-decoration: line-through;
        }

        .route .new {
            border-color: var(--accent);
        }

        .route svg {
            width: 20px;
            height: 20px;
            flex: none;
            color: var(--muted);
        }

        .note {
            width: 100%;
            padding: 14px 16px;
            border-radius: 20px;
            background: var(--surface);
            border: 1px solid var(--border);
            font-size: 13.5px;
            line-height: 2;
            color: var(--muted);
            text-align: right;
            margin-top: 16px;
        }

        .note b {
            color: var(--text);
            font-weight: 700;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border-radius: 9999px;
            background: var(--accent);
            color: #ffffff;
            font-family: inherit;
            font-size: 15px;
            font-weight: 700;
            text-decoration: none;
            transition: background-color 0.18s ease, transform 0.14s ease;
        }

        .btn:active {
            transform: scale(0.97);
            background: var(--accent-hover);
        }

        @media (hover: hover) and (pointer: fine) {
            .btn:hover {
                background: var(--accent-hover);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            main {
                animation: none;
            }
        }
    </style>
</head>
